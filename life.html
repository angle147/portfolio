<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的生活 · 张汝朝作品集</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  background: linear-gradient(155deg, #f4f9df 0%, #e7f1c8 30%, #d4e9b4 55%, #bfe0ad 80%, #a8d6ae 100%);
  min-height: 100vh;
}
.life-top {
  position: sticky;
  top: 16px;
  z-index: 50;
  max-width: 640px;
  margin: 22px auto 0;
  padding: 16px 26px;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(90, 130, 90, 0.25);
  border-radius: 16px;
  text-align: center;
}
.life-top h1 { font-size: 1.3rem; color: #2c4536; font-weight: 600; margin-bottom: 4px; }
.life-top p { font-size: 0.8rem; color: #6d7f68; margin: 0; }
.life-top .back {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #3e7d46;
  text-decoration: none;
  font-size: 0.82rem;
}
.life-top .back:hover { text-decoration: underline; }

.scatter {
  position: relative;
  height: 640px;
  max-width: 980px;
  margin: 26px auto 60px;
}
.scatter .photo-item {
  position: absolute;
  width: 200px;
  height: 200px;
  transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  border: 8px solid #ffffff;
  border-radius: 6px;
  box-shadow: 0 6px 18px rgba(60, 90, 60, 0.18);
  cursor: pointer;
  opacity: 0;
  animation: pop 0.45s ease forwards;
  animation-delay: var(--d, 0s);
  transition: scale 0.2s ease;
  z-index: var(--z, 0);
}
.scatter .photo-item:hover { scale: 1.05; }
.scatter .photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
@keyframes pop {
  from { opacity: 0; scale: 0.8; }
  to { opacity: 1; scale: 1; }
}

@media (max-width: 640px) {
  .scatter { height: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 10px; }
  .scatter .photo-item { position: static; width: 44%; height: auto; aspect-ratio: 1; transform: none; animation: none; opacity: 1; }
  .scatter .photo-item img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scatter .photo-item { overflow: hidden; position: relative; }
}
</style>
</head>
<body>

<div class="life-top">
  <a class="back" href="./">← 返回</a>
  <h1>我的生活</h1>
  <p>工作之外，喜欢到处走走。</p>
</div>

<div class="scatter" id="scatter">
  <div class="photo-item"><img src="assets/20260820-192113.jpg" alt="罗马凯旋门前"></div>
  <div class="photo-item"><img src="assets/20260820-192109.jpg" alt="古建筑旁眺望"></div>
  <div class="photo-item"><img src="assets/20260820-192104.jpg" alt="山顶徒步"></div>
  <div class="photo-item"><img src="assets/20260820-192118.jpg" alt="镜前自拍"></div>
</div>

<script>
// 散落布局：为每张照片生成伪随机位置 / 旋转 / 堆叠序 / 入场延迟
(function () {
  var items = document.querySelectorAll('.scatter .photo-item');
  var isMobile = window.innerWidth <= 640;
  if (isMobile || !items.length) return;
  // 预置坐标池（保证不扎堆、不超出容器），手工微调避免完全随机打架
  var spots = [
    { l: 22, t: 18, r: -4 }, { l: 42, t: 12, r: 3 },
    { l: 68, t: 22, r: -2 }, { l: 30, t: 46, r: 5 },
    { l: 58, t: 42, r: -5 }, { l: 82, t: 48, r: 2 },
    { l: 18, t: 72, r: 3 },  { l: 48, t: 70, r: -3 },
    { l: 74, t: 74, r: 4 },  { l: 90, t: 80, r: -2 }
  ];
  items.forEach(function (el, i) {
    var s = spots[i % spots.length];
    el.style.left = s.l + '%';
    el.style.top = s.t + '%';
    el.style.setProperty('--rot', s.r + 'deg');
    el.style.setProperty('--z', i + 1);
    el.style.setProperty('--d', (i * 0.12) + 's');
  });
})();
</script>

</body>
</html>
